name: Auto-register blog author

# Pages CMS(또는 개발자)가 새 글을 커밋하면,
# 1) frontmatter의 authors: 값이 비어있으면 커밋 작성자의 실제 GitHub 계정으로 채우고
# 2) 그 값이 해당 트랙 authors.yml에 없으면 GitHub 공개 프로필로 자동 등록한다.
#
# 이 워크플로우 자신도 *.mdx를 커밋할 수 있어 *.mdx 트리거 조건에 다시 걸릴 수 있으므로,
# github-actions[bot]이 푸시한 경우는 실행하지 않아 무한루프를 막는다.

on:
  push:
    branches:
      - main
      - main-2
    paths:
      - "@*/**/*.mdx"

permissions:
  contents: write

jobs:
  register-author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependency
        run: npm install --no-save js-yaml

      - name: Register missing authors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/register-authors.mjs

      - name: Commit if changed
        run: |
          git config user.name "bcsd-blog-bot"
          git config user.email "bot@bcsdlab.com"
          git add '@*/authors.yml' '@*/**/*.mdx'
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 신규 작성자 자동 등록/입력"
            git push
          fi
